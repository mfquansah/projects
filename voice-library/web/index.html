<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasa Adaka</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='2' y='2' width='60' height='60' rx='10' fill='none' stroke='%2326323C' stroke-width='3.5'/><rect x='13.9' y='22.7' width='5.7' height='18.5' rx='2.9' fill='%231E8A5C'/><rect x='24.1' y='12.1' width='5.7' height='39.7' rx='2.9' fill='%23EDB231'/><rect x='34.2' y='15.2' width='5.7' height='33.5' rx='2.9' fill='%23D2432B'/><rect x='44.4' y='25.8' width='5.7' height='12.4' rx='2.9' fill='%23EDB231'/></svg>">

<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="main" id="main"></main>
</div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <strong id="dlgTitle">New collection</strong>
    <input type="text" id="dlgName" maxlength="80" aria-label="Collection name" placeholder="Collection name" autocomplete="off">
    <div class="err" id="dlgErr" role="alert"></div>
    <div class="drow"><button type="button" class="ghost" id="dlgCancel">Cancel</button><button type="submit" class="primary" id="dlgOk">Create</button></div>
  </form>
</dialog>
<script type="module" src="/static/js/app.js"></script>
</body>
