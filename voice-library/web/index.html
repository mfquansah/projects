<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasa Adaka</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='3' y='3' width='58' height='58' fill='none' rx='13' stroke='%2326323C' stroke-width='3.5'/><rect x='14' y='23' width='6' height='18' fill='%231E8A5C' rx='3'/><rect x='24' y='13' width='6' height='38' fill='%23EDB231' rx='3'/><rect x='34' y='16' width='6' height='32' fill='%23D2432B' rx='3'/><rect x='44' y='26' width='6' height='12' fill='%23EDB231' rx='3'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="main" id="main"></main>
</div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <strong id="dlgTitle">New collection</strong>
    <input type="text" id="dlgName" maxlength="80" aria-label="Collection name" placeholder="Collection name" autocomplete="off">
    <div class="err" id="dlgErr" role="alert"></div>
    <div class="drow"><button type="button" class="ghost" id="dlgCancel">Cancel</button><button type="submit" class="primary" id="dlgOk">Create</button></div>
  </form>
</dialog>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
