<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasa Adaka</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='1' y='1' width='62' height='62' rx='10' fill='%23FBFAF9' stroke='%232F3A44' stroke-width='1.5'/><rect x='10.5' y='21.0' width='7' height='22' rx='3.5' fill='%230E6B47'/><rect x='22.5' y='12.0' width='7' height='40' rx='3.5' fill='%23E9A912'/><rect x='34.5' y='18.0' width='7' height='28' rx='3.5' fill='%23C8402A'/><rect x='46.5' y='25.0' width='7' height='14' rx='3.5' fill='%23E9A912'/></svg>">

<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="main" id="main"></main>
</div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <strong id="dlgTitle">New collection</strong>
    <input type="text" id="dlgName" maxlength="80" aria-label="Collection name" placeholder="Collection name" autocomplete="off">
    <div class="err" id="dlgErr" role="alert"></div>
    <div class="drow"><button type="button" class="ghost" id="dlgCancel">Cancel</button><button type="submit" class="primary" id="dlgOk">Create</button></div>
  </form>
</dialog>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
